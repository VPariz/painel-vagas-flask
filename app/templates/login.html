<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro • Painel de Vagas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #0f172a;
            --border: rgba(56, 189, 248, 0.25);
            --primary: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 2.2rem 2rem;
            backdrop-filter: blur(16px);
            text-align: center;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: rgba(56, 189, 248, 0.15);
            border: 2px solid var(--primary);
            border-radius: 16px;
            font-size: 1.7rem;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.4rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.6rem; }
        .input-group { text-align: left; margin-bottom: 1.2rem; }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(30, 41, 59, 0.75);
            border: 1.5px solid rgba(148, 163, 184, 0.3);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            color: #ffffff;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid #38bdf8;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 0.85rem;
            border-radius: 12px;
            cursor: pointer;
        }
        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 0.82rem;
            padding: 0.7rem;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .hint-box {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-badge">💼</div>
        <h1>Painel de Vagas</h1>
        <p class="subtitle">Gestão de Oportunidades, Networking & Sincronização de Agenda</p>

        <div id="error-msg" class="error-msg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="pin-input">PIN de Acesso</label>
                <input type="password" id="pin-input" placeholder="••••" required autofocus>
            </div>
            <div class="remember-row">
                <label style="display:flex;align-items:center;gap:0.4rem;cursor:pointer;">
                    <input type="checkbox" id="remember-me" checked>
                    <span>Manter sessão ativa</span>
                </label>
                <span>(30 dias)</span>
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">Desbloquear Painel ➔</button>
        </form>

        <div class="hint-box">
            🔒 Protegido com hash <code>PBKDF2-SHA256</code> e rate-limiting contra força bruta.<br>
            PIN padrão de demonstração: <code>1234</code> (configurável via variável <code>CRM_DEFAULT_PIN</code>).
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById('pin-input');
            const btn = document.getElementById('btn-submit');
            const errorDiv = document.getElementById('error-msg');
            const remember = document.getElementById('remember-me').checked;

            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha: input.value.trim(), remember })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/';
                } else {
                    errorDiv.textContent = data.error || 'PIN incorreto.';
                    errorDiv.style.display = 'block';
                    input.value = '';
                    input.focus();
                    btn.disabled = false;
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de conexão com o servidor.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
